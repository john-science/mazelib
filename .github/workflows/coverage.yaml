name: code coverage

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.repository == 'john-science/mazelib'

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PIP Packages
        run: |
          pip install -e .
          pip install pytest
          pip install codecov
      - name: Run Coverage Tests
        run: |
          coverage run -m unittest discover
          codecov
        env:
          PYTHONHASHSEED: 0
